<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>协同编辑</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 13px;
            background: #f5f6fa;
            color: #333;
        }

        /* ── 视图切换 ─────────────────────────── */
        .view { display: none; padding: 16px; }
        .view.active { display: block; }

        /* ── 通用组件 ─────────────────────────── */
        .title {
            font-size: 15px;
            font-weight: bold;
            color: #1a73e8;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid #1a73e8;
        }

        .form-group { margin-bottom: 10px; }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
        }
        .form-group input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            transition: border .2s;
        }
        .form-group input:focus { border-color: #1a73e8; }

        .btn {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            margin-top: 4px;
            transition: opacity .15s;
        }
        .btn:hover  { opacity: .88; }
        .btn:active { opacity: .75; }
        .btn-primary   { background: #1a73e8; color: #fff; }
        .btn-success   { background: #34a853; color: #fff; }
        .btn-danger    { background: #ea4335; color: #fff; }
        .btn-secondary { background: #e8eaed; color: #444; }

        .link-btn {
            background: none;
            border: none;
            color: #1a73e8;
            cursor: pointer;
            font-size: 12px;
            padding: 6px 0;
            text-decoration: underline;
        }
        .link-center { text-align: center; margin-top: 8px; }

        .error-msg {
            color: #ea4335;
            font-size: 12px;
            margin-top: 6px;
            min-height: 16px;
        }

        /* ── 状态栏 ──────────────────────────── */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .status-bar .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-bar.connected    { background: #e6f4ea; color: #137333; }
        .status-bar.connected .dot    { background: #34a853; }
        .status-bar.disconnected { background: #fce8e6; color: #c5221f; }
        .status-bar.disconnected .dot { background: #ea4335; }
        .status-bar.idle         { background: #e8f0fe; color: #1558bc; }
        .status-bar.idle .dot    { background: #1a73e8; }

        /* ── 用户列表 ─────────────────────────── */
        .section-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin: 10px 0 5px;
        }
        .user-list { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .user-chip {
            background: #e8f0fe;
            color: #1558bc;
            padding: 3px 9px;
            border-radius: 12px;
            font-size: 12px;
        }
        .user-chip.self { background: #e6f4ea; color: #137333; }

        /* ── 文档ID输入row ────────────────────── */
        .doc-row { display: flex; gap: 6px; margin-bottom: 10px; }
        .doc-row input {
            flex: 1;
            padding: 7px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }
        .doc-row input:focus { border-color: #1a73e8; }
        .doc-row .btn { width: auto; padding: 7px 14px; margin-top: 0; }

        hr { border: none; border-top: 1px solid #e8eaed; margin: 12px 0; }

        /* -- 分享视图 ---------------------- */
        .share-search {
            width: 100%; padding: 7px 10px;
            border: 1px solid #ddd; border-radius: 4px;
            font-size: 13px; outline: none; margin-bottom: 8px;
        }
        .share-search:focus { border-color: #1a73e8; }
        #share-user-groups { max-height: 230px; overflow-y: auto; margin-bottom: 6px; }
        .unit-section { margin-bottom: 10px; }
        .unit-label {
            font-size: 11px; font-weight: bold; color: #5f6368;
            background: #f1f3f4; padding: 3px 8px; border-radius: 3px; margin-bottom: 3px;
        }
        .user-check-item {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 8px; border-radius: 4px;
            cursor: pointer; transition: background .12s;
        }
        .user-check-item:hover { background: #f0f4ff; }
        .user-check-item input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
        .user-check-name { font-size: 13px; flex: 1; }
        .user-check-login { font-size: 11px; color: #bbb; }
        .share-btn-row { display: flex; gap: 6px; margin-top: 10px; }
        .share-btn-row .btn { flex: 1; }

        /* -- 邀请弹窗 ---------------------- */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.5); z-index: 999;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff; border-radius: 8px; padding: 20px;
            width: 260px; box-shadow: 0 6px 28px rgba(0,0,0,.22);
        }
        .modal-box .title { margin-bottom: 8px; }
        .modal-body { font-size: 13px; color: #444; line-height: 1.7; margin-bottom: 14px; }
        .modal-actions { display: flex; gap: 8px; }
        .modal-actions .btn { flex: 1; }
    </style>
</head>

<body>

<!-- ═══════════════════════
     视图 1：登录
═══════════════════════ -->
<div id="view-login" class="view active">
    <div class="title">🔐 登录协同系统</div>

    <div class="form-group">
        <label>用户名</label>
        <input id="login-username" type="text" placeholder="请输入用户名" />
    </div>
    <div class="form-group">
        <label>密码</label>
        <input id="login-password" type="password" placeholder="请输入密码" />
    </div>

    <div class="error-msg" id="login-error"></div>

    <button class="btn btn-primary" onclick="doLogin()">登 录</button>
    <div class="link-center">
        <button class="link-btn" onclick="showView('view-register')">还没有账号？立即注册</button>
    </div>
</div>


<!-- ═══════════════════════
     视图 2：注册
═══════════════════════ -->
<div id="view-register" class="view">
    <div class="title">📝 注册新账号</div>

    <div class="form-group">
        <label>用户名 <span style="color:#999;font-size:11px">（2-30字符）</span></label>
        <input id="reg-username" type="text" placeholder="设置用户名" />
    </div>
    <div class="form-group">
        <label>真实姓名 <span style="color:#999;font-size:11px">（可选）</span></label>
        <input id="reg-realname" type="text" placeholder="如：张三" />
    </div>
    <div class="form-group">
        <label>所属单位 <span style="color:#999;font-size:11px">（可选）</span></label>
        <input id="reg-unit" type="text" placeholder="如：侦查大队" />
    </div>
    <div class="form-group">
        <label>密码 <span style="color:#999;font-size:11px">（至少6位）</span></label>
        <input id="reg-password" type="password" placeholder="设置密码" />
    </div>
    <div class="form-group">
        <label>确认密码</label>
        <input id="reg-password2" type="password" placeholder="再次输入密码" />
    </div>

    <div class="error-msg" id="reg-error"></div>

    <button class="btn btn-success" onclick="doRegister()">注 册</button>
    <div class="link-center">
        <button class="link-btn" onclick="showView('view-login')">已有账号？返回登录</button>
    </div>
</div>


<!-- ═══════════════════════
     视图 3：协同面板
═══════════════════════ -->
<div id="view-collab" class="view">

    <div id="status-bar" class="status-bar idle">
        <span class="dot"></span>
        <span id="status-text">空闲</span>
    </div>

    <div style="font-size:13px;margin-bottom:10px;">
        当前用户：<strong id="collab-username"></strong>
    </div>

    <hr>

    <div class="section-label">文档房间</div>
    <div class="doc-row">
        <input id="doc-id-input" type="text" placeholder="输入文档名作为房间号" />
        <button class="btn btn-primary" id="btn-join" onclick="joinCollab()">加入</button>
    </div>
    <div class="error-msg" id="collab-error"></div>

    <div id="online-section" style="display:none">
        <div class="section-label">在线协作者</div>
        <div class="user-list" id="user-list"></div>
        <button class="btn btn-success" onclick="openShareView()" style="margin-bottom:6px">
            &#43; 邀请协作者
        </button>
        <!-- 图片插入按鈕 + 隐藏文件选择框 -->
        <button class="btn btn-secondary" onclick="triggerImagePick()" style="margin-bottom:6px">
            &#128247; 插入/分享图片
        </button>
        <input id="img-file-input" type="file"
               accept="image/jpeg,image/png,image/bmp,image/gif,image/webp"
               style="display:none" onchange="onImageFileSelected(this)" />
        <div class="error-msg" id="img-error"></div>
        <button class="btn btn-danger" onclick="leaveCollab()" style="margin-bottom:6px">
            &#10005; 停止协作
        </button>
    </div>

    <hr>
    <button class="btn btn-secondary" onclick="doLogout()">退出登录</button>
</div>


<!-- ═══════════════════════
     视图 4：邀请协作者
═══════════════════════ -->
<div id="view-share" class="view">
    <div class="title">&#128228; 邀请协作者</div>
    <div style="font-size:12px;color:#666;margin-bottom:10px">
        文档：<strong id="share-doc-id"></strong>
    </div>

    <input id="share-search" class="share-search"
           type="text" placeholder="搜索姓名 / 用户名 / 单位…"
           oninput="filterShareUsers()" />

    <div id="share-user-groups">
        <div style="color:#999;font-size:12px;padding:20px 0;text-align:center">加载中…</div>
    </div>

    <div class="error-msg" id="share-error"></div>

    <div class="share-btn-row">
        <button class="btn btn-primary" onclick="sendInvite()">&#128232; 发送邀请</button>
        <button class="btn btn-secondary" onclick="showView('view-collab')">取消</button>
    </div>
</div>


<!-- ═══════════════════════
     邀请通知弹窗
═══════════════════════ -->
<div id="invite-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="title">&#128232; 收到协作邀请</div>
        <div class="modal-body" id="invite-modal-text"></div>
        <div class="modal-actions">
            <button class="btn btn-success" onclick="respondCurrentInvite('accept')">&#10004; 接受</button>
            <button class="btn btn-secondary" onclick="respondCurrentInvite('reject')">&#10006; 拒绝</button>
        </div>
    </div>
</div>


<!-- ═══════════════════════
     脚本引入
═══════════════════════ -->
<script type="text/javascript" src="../js/util.js"></script>
<script type="text/javascript" src="../js/config.js"></script>
<script type="text/javascript" src="../js/ws-manager.js"></script>
<script type="text/javascript" src="../js/auth.js"></script>
<script type="text/javascript" src="../js/sync.js"></script>
<script>
// 兼容 dev 调试模式动态注入 SDK
(function () {
    var s = document.createElement('script')
    s.src = '../.debugTemp/wpsjsrpcsdk.js'
    s.onerror = function () { /* WPS 内部运行时由 WPS 注入，此处忽略 */ }
    document.head.appendChild(s)
})()
</script>

<script>
// ═══════════════════════════════════════
//  页面逻辑
// ═══════════════════════════════════════

function showView(viewId) {
    document.querySelectorAll('.view').forEach(function (v) {
        v.classList.remove('active')
    })
    document.getElementById(viewId).classList.add('active')
}

function setError(elemId, msg) {
    document.getElementById(elemId).textContent = msg || ''
}

function setStatus(type, text) {
    var bar = document.getElementById('status-bar')
    bar.className = 'status-bar ' + type
    document.getElementById('status-text').textContent = text
}

// ── 登录 ──────────────────────────────
function doLogin() {
    var username = document.getElementById('login-username').value.trim()
    var password = document.getElementById('login-password').value
    setError('login-error', '')

    if (!username || !password) {
        setError('login-error', '请填写用户名和密码')
        return
    }

    Auth.login(username, password).then(function (res) {
        if (res.ok) {
            document.getElementById('collab-username').textContent =
                res.data.realname || res.data.username
            _prefillDocId()
            showView('view-collab')
        } else {
            setError('login-error', res.error)
        }
    })
}

// ── 注册 ──────────────────────────────
function doRegister() {
    var username  = document.getElementById('reg-username').value.trim()
    var realname  = document.getElementById('reg-realname').value.trim()
    var password  = document.getElementById('reg-password').value
    var password2 = document.getElementById('reg-password2').value
    setError('reg-error', '')

    if (!username || !password) {
        setError('reg-error', '请填写用户名和密码')
        return
    }
    if (password !== password2) {
        setError('reg-error', '两次密码不一致')
        return
    }

    Auth.register(username, password, realname, document.getElementById('reg-unit').value.trim()).then(function (res) {
        if (res.ok) {
            alert('注册成功！请登录。')
            document.getElementById('login-username').value = username
            showView('view-login')
        } else {
            setError('reg-error', res.error)
        }
    })
}

// ── 登出 ──────────────────────────────
function doLogout() {
    leaveCollab()
    Auth.clearSession()
    document.getElementById('login-password').value = ''
    showView('view-login')
}

// ── 预填文档名 ────────────────────────
function _prefillDocId() {
    try {
        var doc = window.Application && window.Application.ActiveDocument
        if (doc && doc.Name) {
            document.getElementById('doc-id-input').value = doc.Name
        }
    } catch (e) {}
}

// ── 加入协作 ──────────────────────────
function joinCollab() {
    setError('collab-error', '')
    var docId = document.getElementById('doc-id-input').value.trim()
    if (!docId) {
        setError('collab-error', '请输入文档 ID / 房间名')
        return
    }
    var token = Auth.getToken()
    if (!token) {
        setError('collab-error', 'Token 已失效，请重新登录')
        doLogout()
        return
    }

    setStatus('idle', '连接中...')
    document.getElementById('btn-join').disabled = true

    WSManager.connect(token, docId, {
        onOpen: function () {
            setStatus('connected', '已连接')
        },
        onClose: function () {
            setStatus('disconnected', '连接断开，重连中...')
        },
        onMessage: function (msg) {
            _handleServerMsg(msg)
        },
    })
}

// ── 处理服务器消息 ─────────────────────
function _handleServerMsg(msg) {
    switch (msg.type) {
        case 'welcome':
            _updateUserList(msg.users, msg.username)
            document.getElementById('online-section').style.display = 'block'
            document.getElementById('btn-join').style.display = 'none'
            DocSync.initFromSnapshot(msg.content, msg.seq, msg.images || [])  // 初始化文字+图片
            DocSync.start()
            setStatus('connected', '协作中 · ' + msg.doc_id)
            break

        case 'change':
            DocSync.applyRemote(msg.delta, msg.seq)  // 传入 seq 更新本地计数器
            break

        case 'insert_image':
            DocSync.applyRemoteImage(msg)
            break

        case 'invitation':
            _queueInvitation(msg)
            break

        case 'user_join':
        case 'user_leave':
            _updateUserList(msg.users, Auth.getUsername())
            break

        case 'error':
            setError('collab-error', msg.message)
            setStatus('disconnected', '错误：' + msg.message)
            document.getElementById('btn-join').disabled = false
            break

        case 'pong':
            break
    }
}

// ── 更新在线用户列表 ──────────────────
function _updateUserList(users, selfUsername) {
    var list = document.getElementById('user-list')
    list.innerHTML = (users || []).map(function (u) {
        var cls   = (u === selfUsername) ? 'user-chip self' : 'user-chip'
        var label = (u === selfUsername) ? u + '（我）' : u
        return '<span class="' + cls + '">' + label + '</span>'
    }).join('')
}

// ── 图片上传 ──────────────────────────────
function triggerImagePick() {
    document.getElementById('img-file-input').click()
}

function onImageFileSelected(input) {
    var file = input.files && input.files[0]
    if (!file) return
    input.value = ''  // 允许重复选同一文件

    var docId = document.getElementById('doc-id-input').value.trim()
    if (!docId) {
        setError('img-error', '请先加入文档房间')
        return
    }
    setError('img-error', '')

    // 读取文件为 Blob，构建 FormData 上传
    var reader = new FileReader()
    reader.onload = function (e) {
        var blob     = new Blob([e.target.result], { type: file.type })
        var formData = new FormData()
        formData.append('file', blob, file.name)
        formData.append('doc_id', docId)
        // 获取当前光标位置作为插入点
        var pos = 0
        try {
            var sel = window.Application && window.Application.Selection
            if (sel) pos = sel.Range.Start
        } catch (ex) {}
        formData.append('position', pos)

        var xhr = new XMLHttpRequest()
        xhr.open('POST', COLLAB_CONFIG.SERVER_HTTP + '/api/upload_image')
        xhr.setRequestHeader('Authorization', 'Bearer ' + Auth.getToken())
        xhr.onload = function () {
            try {
                var res = JSON.parse(xhr.responseText)
                if (xhr.status === 201) {
                    // 在本地文档光标处插入图片
                    try {
                        var doc    = window.Application.ActiveDocument
                        var range  = doc.Range(pos, pos)
                        var shape  = doc.InlineShapes.AddPicture(
                            COLLAB_CONFIG.SERVER_HTTP + res.url, false, true, range)
                        if (res.img_width  > 0) shape.Width  = res.img_width
                        if (res.img_height > 0) shape.Height = res.img_height
                    } catch (ex) {
                        console.warn('[Image] 本地插入失败，图片已上传至服务器', ex)
                    }
                    setError('img-error', '')
                } else {
                    setError('img-error', res.error || '上传失败')
                }
            } catch (ex) {
                setError('img-error', '响应解析失败')
            }
        }
        xhr.onerror = function () { setError('img-error', '上传网络错误') }
        xhr.send(formData)
    }
    reader.onerror = function () { setError('img-error', '读取文件失败') }
    reader.readAsArrayBuffer(file)
}

// ── 停止协作 ──────────────────────────
function leaveCollab() {
    DocSync.stop()
    WSManager.disconnect()
    setStatus('idle', '空闲')
    document.getElementById('online-section').style.display = 'none'
    document.getElementById('btn-join').style.display = ''
    document.getElementById('btn-join').disabled = false
    document.getElementById('user-list').innerHTML = ''
}

// ── 初始化 ────────────────────────────
window.onload = function () {
    if (Auth.isLoggedIn()) {
        document.getElementById('collab-username').textContent =
            Auth.getRealname() || Auth.getUsername()
        _prefillDocId()
        showView('view-collab')
        _startInvitePolling()  // 登录状态下开启轮询容错率
    } else {
        showView('view-login')
    }
}

// ─────────────────────────────────────────────
//  邀请功能
// ─────────────────────────────────────────────

// -- 分享视图数据 ———————————————————————
var _allUserGroups = []   // [{unit, users:[{username,realname}]}]

function openShareView() {
    var docId = document.getElementById('doc-id-input').value.trim()
    document.getElementById('share-doc-id').textContent = docId
    document.getElementById('share-error').textContent  = ''
    document.getElementById('share-search').value       = ''
    showView('view-share')
    _loadUserList()
}

function _loadUserList() {
    var container = document.getElementById('share-user-groups')
    container.innerHTML = '<div style="color:#999;font-size:12px;padding:20px 0;text-align:center">加载中…</div>'

    fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/users', {
        headers: { 'Authorization': 'Bearer ' + Auth.getToken() }
    })
    .then(function (res) { return res.json() })
    .then(function (data) {
        _allUserGroups = data.groups || []
        _renderUserGroups(_allUserGroups)
    })
    .catch(function () {
        container.innerHTML = '<div style="color:#ea4335;font-size:12px;padding:10px 0">加载失败，请重试</div>'
    })
}

function _renderUserGroups(groups) {
    var container = document.getElementById('share-user-groups')
    if (!groups || !groups.length) {
        container.innerHTML = '<div style="color:#999;font-size:12px;padding:20px 0;text-align:center">暂无其他已注册用户</div>'
        return
    }
    container.innerHTML = groups.map(function (g) {
        var items = g.users.map(function (u) {
            return '<label class="user-check-item">'
                + '<input type="checkbox" class="share-check" value="' + u.username + '">'
                + '<span class="user-check-name">' + (u.realname || u.username) + '</span>'
                + '<span class="user-check-login">' + u.username + '</span>'
                + '</label>'
        }).join('')
        return '<div class="unit-section">'
            + '<div class="unit-label">' + g.unit + '</div>'
            + items
            + '</div>'
    }).join('')
}

function filterShareUsers() {
    var kw = document.getElementById('share-search').value.trim().toLowerCase()
    if (!kw) {
        _renderUserGroups(_allUserGroups)
        return
    }
    var filtered = _allUserGroups.map(function (g) {
        return {
            unit: g.unit,
            users: g.users.filter(function (u) {
                return (u.realname || '').toLowerCase().indexOf(kw) >= 0
                    || u.username.toLowerCase().indexOf(kw) >= 0
                    || g.unit.toLowerCase().indexOf(kw) >= 0
            })
        }
    }).filter(function (g) { return g.users.length > 0 })
    _renderUserGroups(filtered)
}

function sendInvite() {
    var checked = document.querySelectorAll('.share-check:checked')
    if (!checked.length) {
        setError('share-error', '请勾选至少一个协作者')
        return
    }
    var usernames = []
    checked.forEach(function (el) { usernames.push(el.value) })
    var docId = document.getElementById('doc-id-input').value.trim()
    setError('share-error', '')

    fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/invite', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + Auth.getToken()
        },
        body: JSON.stringify({ doc_id: docId, usernames: usernames })
    })
    .then(function (res) { return res.json() })
    .then(function (data) {
        if (data.invited !== undefined) {
            alert('已向 ' + data.invited + ' 人发送邀请\u002c等待对方同意后即可加入。')
            showView('view-collab')
        } else {
            setError('share-error', data.error || '发送失败')
        }
    })
    .catch(function () { setError('share-error', '网络错误，请重试') })
}

// -- 邀请队列 ———————————————————————
var _inviteQueue    = []    // 待处理邀请队列
var _invitePolling  = null  // setInterval ID
var _knownInviteIds = {}    // {id: true}

function _queueInvitation(inv) {
    if (_knownInviteIds[inv.invite_id]) return
    _knownInviteIds[inv.invite_id] = true
    _inviteQueue.push(inv)
    if (_inviteQueue.length === 1) _showNextInvite()
}

function _showNextInvite() {
    if (!_inviteQueue.length) return
    var inv = _inviteQueue[0]
    var name = inv.from_realname || inv.from_user
    document.getElementById('invite-modal-text').innerHTML =
        '<strong>' + name + '</strong> 邀请您共同编辑文档：<br>'
        + '<strong style="color:#1a73e8">' + inv.doc_id + '</strong>'
    document.getElementById('invite-modal').classList.add('active')
}

function respondCurrentInvite(action) {
    if (!_inviteQueue.length) return
    var inv = _inviteQueue.shift()
    document.getElementById('invite-modal').classList.remove('active')

    fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/invite/' + inv.invite_id + '/respond', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + Auth.getToken()
        },
        body: JSON.stringify({ action: action })
    })
    .then(function (res) { return res.json() })
    .then(function (data) {
        if (action === 'accept' && data.ok) {
            _joinByDocId(data.doc_id)
        }
        // 处理下一个邀请（如果有）
        setTimeout(_showNextInvite, 300)
    })
    .catch(function () { setTimeout(_showNextInvite, 300) })
}

function _joinByDocId(docId) {
    // 如果已在另一个房间，先退出
    if (DocSync.isRunning()) leaveCollab()
    showView('view-collab')
    setTimeout(function () {
        document.getElementById('doc-id-input').value = docId
        joinCollab()
    }, 200)
}

// -- 轮询未处理邀请（用户尚未加入任何房间时的容错率）———
function _startInvitePolling() {
    if (_invitePolling) return
    _invitePolling = setInterval(function () {
        if (!Auth.isLoggedIn()) return
        if (DocSync.isRunning()) return  // WS 已在线，由 WS 推送，无需轮询
        fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/invite/pending', {
            headers: { 'Authorization': 'Bearer ' + Auth.getToken() }
        })
        .then(function (res) { return res.json() })
        .then(function (data) {
            (data.invitations || []).forEach(_queueInvitation)
        })
        .catch(function () {})
    }, 5000)
}

function _stopInvitePolling() {
    if (_invitePolling) { clearInterval(_invitePolling); _invitePolling = null }
}
</script>
