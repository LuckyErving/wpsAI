<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>协同编辑</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            font-size: 13px;
            background: #f5f6fa;
            color: #333;
        }

        /* ── 视图切换 ─────────────────────────── */
        .view { display: none; padding: 16px; }
        .view.active { display: block; }

        /* ── 通用组件 ─────────────────────────── */
        .title {
            font-size: 15px;
            font-weight: bold;
            color: #1a73e8;
            margin-bottom: 14px;
            padding-bottom: 8px;
            border-bottom: 2px solid #1a73e8;
        }

        .form-group { margin-bottom: 10px; }
        .form-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 3px;
        }
        .form-group input {
            width: 100%;
            padding: 7px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
            transition: border .2s;
        }
        .form-group input:focus { border-color: #1a73e8; }

        .btn {
            width: 100%;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            margin-top: 4px;
            transition: opacity .15s;
        }
        .btn:hover  { opacity: .88; }
        .btn:active { opacity: .75; }
        .btn-primary   { background: #1a73e8; color: #fff; }
        .btn-success   { background: #34a853; color: #fff; }
        .btn-danger    { background: #ea4335; color: #fff; }
        .btn-secondary { background: #e8eaed; color: #444; }

        .link-btn {
            background: none;
            border: none;
            color: #1a73e8;
            cursor: pointer;
            font-size: 12px;
            padding: 6px 0;
            text-decoration: underline;
        }
        .link-center { text-align: center; margin-top: 8px; }

        .error-msg {
            color: #ea4335;
            font-size: 12px;
            margin-top: 6px;
            min-height: 16px;
        }

        /* ── 状态栏 ──────────────────────────── */
        .status-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 10px;
            border-radius: 6px;
            font-size: 12px;
            margin-bottom: 12px;
        }
        .status-bar .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
        }
        .status-bar.connected    { background: #e6f4ea; color: #137333; }
        .status-bar.connected .dot    { background: #34a853; }
        .status-bar.disconnected { background: #fce8e6; color: #c5221f; }
        .status-bar.disconnected .dot { background: #ea4335; }
        .status-bar.idle         { background: #e8f0fe; color: #1558bc; }
        .status-bar.idle .dot    { background: #1a73e8; }

        /* ── 用户列表 ─────────────────────────── */
        .section-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: .5px;
            margin: 10px 0 5px;
        }
        .user-list { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
        .user-chip {
            background: #e8f0fe;
            color: #1558bc;
            padding: 3px 9px;
            border-radius: 12px;
            font-size: 12px;
        }
        .user-chip.self { background: #e6f4ea; color: #137333; }

        /* ── 文档ID输入row ────────────────────── */
        .doc-row { display: flex; gap: 6px; margin-bottom: 10px; }
        .doc-row input {
            flex: 1;
            padding: 7px 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 13px;
            outline: none;
        }
        .doc-row input:focus { border-color: #1a73e8; }
        .doc-row .btn { width: auto; padding: 7px 14px; margin-top: 0; }

        hr { border: none; border-top: 1px solid #e8eaed; margin: 12px 0; }

        /* -- 分享视图 ---------------------- */
        .share-search {
            width: 100%; padding: 7px 10px;
            border: 1px solid #ddd; border-radius: 4px;
            font-size: 13px; outline: none; margin-bottom: 8px;
        }
        .share-search:focus { border-color: #1a73e8; }
        #share-user-groups { max-height: 230px; overflow-y: auto; margin-bottom: 6px; }
        .unit-section { margin-bottom: 10px; }
        .unit-label {
            font-size: 11px; font-weight: bold; color: #5f6368;
            background: #f1f3f4; padding: 3px 8px; border-radius: 3px; margin-bottom: 3px;
        }
        .user-check-item {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 8px; border-radius: 4px;
            cursor: pointer; transition: background .12s;
        }
        .user-check-item:hover { background: #f0f4ff; }
        .user-check-item input[type=checkbox] { width: 14px; height: 14px; cursor: pointer; flex-shrink: 0; }
        .user-check-name { font-size: 13px; flex: 1; }
        .user-check-login { font-size: 11px; color: #bbb; }
        .share-btn-row { display: flex; gap: 6px; margin-top: 10px; }
        .share-btn-row .btn { flex: 1; }

        /* -- 邀请弹窗 ---------------------- */
        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,.5); z-index: 999;
            align-items: center; justify-content: center;
        }
        .modal-overlay.active { display: flex; }
        .modal-box {
            background: #fff; border-radius: 8px; padding: 20px;
            width: 260px; box-shadow: 0 6px 28px rgba(0,0,0,.22);
        }
        .modal-box .title { margin-bottom: 8px; }
        .modal-body { font-size: 13px; color: #444; line-height: 1.7; margin-bottom: 14px; }
        .modal-actions { display: flex; gap: 8px; }
        .modal-actions .btn { flex: 1; }

        /* -- 通知徽标 ---------------------- */
        .notif-badge {
            position: absolute;
            top: -4px; right: -4px;
            background: #ea4335;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            border-radius: 10px;
            min-width: 16px;
            height: 16px;
            line-height: 16px;
            text-align: center;
            padding: 0 4px;
            display: none;
        }
        .btn-icon-wrap { position: relative; display: inline-block; width: 100%; }

        /* -- 历史/通知列表 ---------------------- */
        .list-card {
            background: #fff;
            border: 1px solid #e8eaed;
            border-radius: 6px;
            margin-bottom: 6px;
            padding: 10px 12px;
            cursor: pointer;
            transition: box-shadow .12s;
        }
        .list-card:hover { box-shadow: 0 2px 8px rgba(0,0,0,.12); }
        .list-card .card-title { font-size: 13px; font-weight: bold; color: #1a73e8; }
        .list-card .card-meta  { font-size: 11px; color: #999; margin-top: 2px; }
        .notif-card { cursor: default; }
        .notif-card.unread { border-left: 3px solid #1a73e8; }
        .notif-card .notif-content { font-size: 13px; color: #333; }
        .notif-card .notif-time { font-size: 11px; color: #999; margin-top: 2px; }
        .scroll-area { max-height: 340px; overflow-y: auto; }
        .hist-snap-item {
            padding: 6px 10px;
            border-bottom: 1px solid #f0f0f0;
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px;
        }
        .hist-snap-item:last-child { border-bottom: none; }
        .restore-btn {
            padding: 3px 10px;
            border: 1px solid #1a73e8;
            border-radius: 4px;
            background: #fff;
            color: #1a73e8;
            cursor: pointer;
            font-size: 11px;
        }
        .restore-btn:hover { background: #e8f0fe; }

        .format-toolbar {
            border: 1px solid #e8eaed;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            background: #fff;
        }
        .format-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }
        .format-row:last-child { margin-bottom: 0; }
        .format-btn {
            flex: 1;
            padding: 7px 0;
            border: 1px solid #d2d6dc;
            border-radius: 4px;
            background: #f8fafc;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
        }
        .format-input, .format-select {
            flex: 1;
            min-width: 0;
            padding: 7px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
        }
    </style>
</head>

<body>

<!-- ═══════════════════════
     视图 1：登录
═══════════════════════ -->
<div id="view-login" class="view active">
    <div class="title">🔐 登录协同系统</div>

    <div class="form-group">
        <label>用户名</label>
        <input id="login-username" type="text" placeholder="请输入用户名" />
    </div>
    <div class="form-group">
        <label>密码</label>
        <input id="login-password" type="password" placeholder="请输入密码" />
    </div>

    <div class="error-msg" id="login-error"></div>

    <button class="btn btn-primary" onclick="doLogin()">登 录</button>
    <div class="link-center">
        <button class="link-btn" onclick="showView('view-register')">还没有账号？立即注册</button>
    </div>
</div>


<!-- ═══════════════════════
     视图 2：注册
═══════════════════════ -->
<div id="view-register" class="view">
    <div class="title">📝 注册新账号</div>

    <div class="form-group">
        <label>用户名 <span style="color:#999;font-size:11px">（2-30字符）</span></label>
        <input id="reg-username" type="text" placeholder="设置用户名" />
    </div>
    <div class="form-group">
        <label>真实姓名 <span style="color:#999;font-size:11px">（可选）</span></label>
        <input id="reg-realname" type="text" placeholder="如：张三" />
    </div>
    <div class="form-group">
        <label>所属单位 <span style="color:#999;font-size:11px">（可选）</span></label>
        <input id="reg-unit" type="text" placeholder="如：侦查大队" />
    </div>
    <div class="form-group">
        <label>密码 <span style="color:#999;font-size:11px">（至少6位）</span></label>
        <input id="reg-password" type="password" placeholder="设置密码" />
    </div>
    <div class="form-group">
        <label>确认密码</label>
        <input id="reg-password2" type="password" placeholder="再次输入密码" />
    </div>

    <div class="error-msg" id="reg-error"></div>

    <button class="btn btn-success" onclick="doRegister()">注 册</button>
    <div class="link-center">
        <button class="link-btn" onclick="showView('view-login')">已有账号？返回登录</button>
    </div>
</div>


<!-- ═══════════════════════
     视图 3：协同面板
═══════════════════════ -->
<div id="view-collab" class="view">

    <div id="status-bar" class="status-bar idle">
        <span class="dot"></span>
        <span id="status-text">空闲</span>
    </div>

    <div style="font-size:13px;margin-bottom:10px;">
        当前用户：<strong id="collab-username"></strong>
    </div>

    <hr>

    <div class="section-label">文档房间</div>
    <div class="doc-row">
        <input id="doc-id-input" type="text" placeholder="输入文档名作为房间号" />
        <button class="btn btn-primary" id="btn-join" onclick="joinCollab()">加入</button>
    </div>
    <div class="error-msg" id="collab-error"></div>

    <div id="online-section" style="display:none">
        <div class="section-label">在线协作者</div>
        <div class="user-list" id="user-list"></div>
        <div class="section-label">协同格式（通过本面板触发）</div>
        <div class="format-toolbar">
            <div class="format-row">
                <button class="format-btn" onclick="applyFormatToggle('bold')">B 加粗</button>
                <button class="format-btn" onclick="applyFormatToggle('italic')">I 斜体</button>
                <button class="format-btn" onclick="applyFormatToggle('underline')">U 下划线</button>
            </div>
            <div class="format-row">
                <input id="format-size-input" class="format-input" type="number" min="1" placeholder="字号，如 14" />
                <button class="format-btn" onclick="applyFontSize()">设置字号</button>
            </div>
            <div class="format-row">
                <select id="format-color-select" class="format-select">
                    <option value="0">黑色</option>
                    <option value="255">红色</option>
                    <option value="65280">绿色</option>
                    <option value="16711680">蓝色</option>
                </select>
                <button class="format-btn" onclick="applyFontColor()">设置颜色</button>
            </div>
            <div class="error-msg" id="format-error"></div>
        </div>
        <button class="btn btn-success" onclick="openShareView()" style="margin-bottom:6px">
            &#43; 邀请协作者
        </button>
        <div style="display:flex;gap:6px;margin-bottom:6px">
            <div class="btn-icon-wrap" style="flex:1">
                <button class="btn btn-secondary" style="width:100%" onclick="openHistoryView()">&#128196; 历史文档</button>
            </div>
            <div class="btn-icon-wrap" style="flex:1">
                <button class="btn btn-secondary" style="width:100%" onclick="openNotifView()">&#128276; 通知</button>
                <span id="notif-badge" class="notif-badge"></span>
            </div>
        </div>
        <!-- 图片插入按鈕 + 隐藏文件选择框 -->
        <button class="btn btn-secondary" onclick="triggerImagePick()" style="margin-bottom:6px">
            &#128247; 插入/分享图片
        </button>
        <input id="img-file-input" type="file"
               accept="image/jpeg,image/png,image/bmp,image/gif,image/webp"
               style="display:none" onchange="onImageFileSelected(this)" />
        <div class="error-msg" id="img-error"></div>
        <button class="btn btn-danger" onclick="leaveCollab()" style="margin-bottom:6px">
            &#10005; 停止协作
        </button>
    </div>

    <hr>
    <button class="btn btn-secondary" onclick="doLogout()">退出登录</button>
</div>


<!-- ═══════════════════════
     视图 4：邀请协作者
═══════════════════════ -->
<div id="view-share" class="view">
    <div class="title">&#128228; 邀请协作者</div>
    <div style="font-size:12px;color:#666;margin-bottom:10px">
        文档：<strong id="share-doc-id"></strong>
    </div>

    <input id="share-search" class="share-search"
           type="text" placeholder="搜索姓名 / 用户名 / 单位…"
           oninput="filterShareUsers()" />

    <div id="share-user-groups">
        <div style="color:#999;font-size:12px;padding:20px 0;text-align:center">加载中…</div>
    </div>

    <div class="error-msg" id="share-error"></div>

    <div class="share-btn-row">
        <button class="btn btn-primary" onclick="sendInvite()">&#128232; 发送邀请</button>
        <button class="btn btn-secondary" onclick="showView('view-collab')">取消</button>
    </div>
</div>


<!-- ═══════════════════════
     视图 5：历史文档
═══════════════════════ -->
<div id="view-history" class="view">
    <div class="title">&#128196; 历史协作文档</div>

    <div id="hist-doc-list" class="scroll-area">
        <div style="color:#999;font-size:12px;padding:20px 0;text-align:center">加载中…</div>
    </div>

    <!-- 单个文档的快照列表（折叠面板） -->
    <div id="hist-snap-panel" style="display:none">
        <div style="display:flex;align-items:center;gap:8px;margin:10px 0 6px">
            <button class="link-btn" onclick="_showHistDocList()" style="padding:0">&#8592; 返回</button>
            <span style="font-size:13px;font-weight:bold" id="hist-panel-title"></span>
        </div>
        <div id="hist-snap-list" class="scroll-area"></div>
    </div>

    <div class="error-msg" id="hist-error"></div>
    <button class="btn btn-secondary" style="margin-top:8px" onclick="showView('view-collab')">返回协同面板</button>
</div>


<!-- ═══════════════════════
     视图 6：通知列表
═══════════════════════ -->
<div id="view-notifications" class="view">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
        <div class="title" style="margin-bottom:0;border:none">&#128276; 通知</div>
        <button class="link-btn" onclick="markAllRead()" style="padding:0">全部已读</button>
    </div>

    <div id="notif-list" class="scroll-area">
        <div style="color:#999;font-size:12px;padding:20px 0;text-align:center">加载中…</div>
    </div>

    <div class="error-msg" id="notif-error"></div>
    <button class="btn btn-secondary" style="margin-top:8px" onclick="showView('view-collab')">返回协同面板</button>
</div>


<!-- ═══════════════════════
     邀请通知弹窗
═══════════════════════ -->
<div id="invite-modal" class="modal-overlay">
    <div class="modal-box">
        <div class="title">&#128232; 收到协作邀请</div>
        <div class="modal-body" id="invite-modal-text"></div>
        <div class="modal-actions">
            <button class="btn btn-success" onclick="respondCurrentInvite('accept')">&#10004; 接受</button>
            <button class="btn btn-secondary" onclick="respondCurrentInvite('reject')">&#10006; 拒绝</button>
        </div>
    </div>
</div>


<!-- ═══════════════════════
     脚本引入
═══════════════════════ -->
<script type="text/javascript" src="../js/util.js"></script>
<script type="text/javascript" src="../js/config.js"></script>
<script type="text/javascript" src="../js/ws-manager.js"></script>
<script type="text/javascript" src="../js/auth.js"></script>
<script type="text/javascript" src="../js/sync.js"></script>
<script>
// 兼容 dev 调试模式动态注入 SDK
(function () {
    var s = document.createElement('script')
    s.src = '../.debugTemp/wpsjsrpcsdk.js'
    s.onerror = function () { /* WPS 内部运行时由 WPS 注入，此处忽略 */ }
    document.head.appendChild(s)
})()
</script>

<script>
// ═══════════════════════════════════════
//  页面逻辑
// ═══════════════════════════════════════

function showView(viewId) {
    document.querySelectorAll('.view').forEach(function (v) {
        v.classList.remove('active')
    })
    document.getElementById(viewId).classList.add('active')
}

function setError(elemId, msg) {
    document.getElementById(elemId).textContent = msg || ''
}

function setStatus(type, text) {
    var bar = document.getElementById('status-bar')
    bar.className = 'status-bar ' + type
    document.getElementById('status-text').textContent = text
}

// ── 登录 ──────────────────────────────
function doLogin() {
    var username = document.getElementById('login-username').value.trim()
    var password = document.getElementById('login-password').value
    setError('login-error', '')

    if (!username || !password) {
        setError('login-error', '请填写用户名和密码')
        return
    }

    Auth.login(username, password).then(function (res) {
        if (res.ok) {
            document.getElementById('collab-username').textContent =
                res.data.realname || res.data.username
            _prefillDocId()
            showView('view-collab')
        } else {
            setError('login-error', res.error)
        }
    })
}

// ── 注册 ──────────────────────────────
function doRegister() {
    var username  = document.getElementById('reg-username').value.trim()
    var realname  = document.getElementById('reg-realname').value.trim()
    var password  = document.getElementById('reg-password').value
    var password2 = document.getElementById('reg-password2').value
    setError('reg-error', '')

    if (!username || !password) {
        setError('reg-error', '请填写用户名和密码')
        return
    }
    if (password !== password2) {
        setError('reg-error', '两次密码不一致')
        return
    }

    Auth.register(username, password, realname, document.getElementById('reg-unit').value.trim()).then(function (res) {
        if (res.ok) {
            alert('注册成功！请登录。')
            document.getElementById('login-username').value = username
            showView('view-login')
        } else {
            setError('reg-error', res.error)
        }
    })
}

// ── 登出 ──────────────────────────────
function doLogout() {
    leaveCollab()
    Auth.clearSession()
    document.getElementById('login-password').value = ''
    showView('view-login')
}

// ── 预填文档名 ────────────────────────
function _prefillDocId() {
    try {
        var doc = window.Application && window.Application.ActiveDocument
        if (doc && doc.Name) {
            document.getElementById('doc-id-input').value = doc.Name
        }
    } catch (e) {}
}

// ── 加入协作 ──────────────────────────
function joinCollab() {
    setError('collab-error', '')
    var docId = document.getElementById('doc-id-input').value.trim()
    if (!docId) {
        setError('collab-error', '请输入文档 ID / 房间名')
        return
    }
    var token = Auth.getToken()
    if (!token) {
        setError('collab-error', 'Token 已失效，请重新登录')
        doLogout()
        return
    }

    setStatus('idle', '连接中...')
    document.getElementById('btn-join').disabled = true

    // 加入时绑定当前激活文档，后续所有读写都针对此文档，
    // 避免多窗口共享 JS 运行时时 ActiveDocument 随焦点切换导致交叉操作
    var _joinDoc = null
    try { _joinDoc = window.Application && window.Application.ActiveDocument } catch (e) {}

    WSManager.connect(token, docId, {
        onOpen: function () {
            setStatus('connected', '已连接')
        },
        onClose: function () {
            setStatus('disconnected', '连接断开，重连中...')
        },
        onMessage: function (msg) {
            _handleServerMsg(msg, _joinDoc)
        },
    })

    // 加入后上报当前文档的完整路径，供其他被邀请者打开文档使用
    try {
        var fullPath = _joinDoc ? _joinDoc.FullName : ''
        if (fullPath) {
            // WS 可能还未 open，稍等连接成功后再发
            var _pathTimer = setInterval(function () {
                if (WSManager.connected()) {
                    WSManager.send({ type: 'register_path', path: fullPath })
                    clearInterval(_pathTimer)
                }
            }, 200)
        }
    } catch (e) {}
}

// ── 处理服务器消息 ─────────────────────
function _handleServerMsg(msg, boundDoc) {
    switch (msg.type) {
        case 'welcome':
            _updateUserList(msg.users, msg.username)
            document.getElementById('online-section').style.display = 'block'
            document.getElementById('btn-join').style.display = 'none'
            DocSync.initFromSnapshot(msg.content, msg.seq, msg.images || [])  // 初始化文字+图片
            DocSync.start(boundDoc)
            // 若服务器没有该文档的内容快照（首次建房或重启后），
            // 立即把本地文档全文推送给服务器作为初始种子。
            // 这样后续 delta 才能被正确地应用在完整文本上，
            // 晚加入的成员也能收到完整的文档内容。
            if (!msg.content) {
                DocSync.pushInitialContent()
                // 竞态保护：延迟 1.5s 后再向服务器请求一次最新快照，
                // 防止本客户端在另一成员 pushInitialContent 尚未被服务器处理前就连上，
                // 导致收到空 welcome 后看不到已有内容。
                setTimeout(function() { WSManager.send({ type: 'get_snapshot' }) }, 1500)
            }
            setStatus('connected', '协作中 · ' + msg.doc_id)
            // 加入后刷新通知徽标
            _refreshNotifBadge()
            break

        case 'content_ack':
            // 服务器确认 content_update 已处理，清除发送锁，立即检测累积变更
            DocSync.contentAck()
            break

        case 'content_update':
            // 接收远程完整 XML 内容（含文字+格式），应用到本地文档
            DocSync.applyRemoteContent(msg.xml)
            break

        case 'insert_image':
            DocSync.applyRemoteImage(msg)
            break

        case 'format_op':
            DocSync.applyRemoteFormatOp(msg)
            break

        case 'invitation':
            _queueInvitation(msg)
            // 同时更新通知徽标
            _refreshNotifBadge()
            break

        case 'notification':
            // 服务器主动推送的通知（非邀请类）
            _refreshNotifBadge()
            break

        case 'snapshot':
            // 服务器响应 get_snapshot 请求，仅在本地文档为空时才用服务器内容初始化。
            // 此消息只在竞态场景下发送（welcome 为空时延迟 1.5s 拉取），
            // 若本地已有内容说明是房间创建者，不应被覆盖。
            if (msg.content && !DocSync.getLocalText()) {
                DocSync.initFromSnapshot(msg.content, msg.seq, msg.images || [])
            }
            break

        case 'save_ack':
            if (msg.ok) {
                console.log('[AutoSave] 自动保存成功')
            } else {
                console.warn('[AutoSave] 自动保存失败:', msg.error)
            }
            break

        case 'user_join':
        case 'user_leave':
            _updateUserList(msg.users, Auth.getUsername())
            break

        case 'error':
            setError('collab-error', msg.message)
            setStatus('disconnected', '错误：' + msg.message)
            document.getElementById('btn-join').disabled = false
            break

        case 'pong':
            break
    }
}

// ── 更新在线用户列表 ──────────────────
function _updateUserList(users, selfUsername) {
    var list = document.getElementById('user-list')
    list.innerHTML = (users || []).map(function (u) {
        var cls   = (u === selfUsername) ? 'user-chip self' : 'user-chip'
        var label = (u === selfUsername) ? u + '（我）' : u
        return '<span class="' + cls + '">' + label + '</span>'
    }).join('')
}

// ── 图片上传 ──────────────────────────────
function triggerImagePick() {
    document.getElementById('img-file-input').click()
}

function applyFormatToggle(kind) {
    setError('format-error', '')
    var res = DocSync.applyLocalFormat(kind)
    if (!res.ok) setError('format-error', res.error || '格式设置失败')
}

function applyFontSize() {
    setError('format-error', '')
    var size = document.getElementById('format-size-input').value
    var res = DocSync.applyLocalFormat('size', size)
    if (!res.ok) setError('format-error', res.error || '字号设置失败')
}

function applyFontColor() {
    setError('format-error', '')
    var color = document.getElementById('format-color-select').value
    var res = DocSync.applyLocalFormat('color', color)
    if (!res.ok) setError('format-error', res.error || '颜色设置失败')
}

function onImageFileSelected(input) {
    var file = input.files && input.files[0]
    if (!file) return
    input.value = ''  // 允许重复选同一文件

    var docId = document.getElementById('doc-id-input').value.trim()
    if (!docId) {
        setError('img-error', '请先加入文档房间')
        return
    }
    setError('img-error', '')

    // 读取文件为 Blob，构建 FormData 上传
    var reader = new FileReader()
    reader.onload = function (e) {
        var blob     = new Blob([e.target.result], { type: file.type })
        var formData = new FormData()
        formData.append('file', blob, file.name)
        formData.append('doc_id', docId)
        // 获取当前光标位置作为插入点
        var pos = 0
        try {
            var sel = window.Application && window.Application.Selection
            if (sel) pos = sel.Range.Start
        } catch (ex) {}
        formData.append('position', pos)

        var xhr = new XMLHttpRequest()
        xhr.open('POST', COLLAB_CONFIG.SERVER_HTTP + '/api/upload_image')
        xhr.setRequestHeader('Authorization', 'Bearer ' + Auth.getToken())
        xhr.onload = function () {
            try {
                var res = JSON.parse(xhr.responseText)
                if (xhr.status === 201) {
                    // 在本地文档光标处插入图片
                    try {
                        var doc    = window.Application.ActiveDocument
                        var range  = doc.Range(pos, pos)
                        var shape  = doc.InlineShapes.AddPicture(
                            COLLAB_CONFIG.SERVER_HTTP + res.url, false, true, range)
                        if (res.img_width  > 0) shape.Width  = res.img_width
                        if (res.img_height > 0) shape.Height = res.img_height
                    } catch (ex) {
                        console.warn('[Image] 本地插入失败，图片已上传至服务器', ex)
                    }
                    // 注册到 DocSync，防止收到服务器 insert_image 广播时重复插入
                    DocSync.addLocalImage(res.file_id, res.url, pos, res.img_width, res.img_height)
                    setError('img-error', '')
                } else {
                    setError('img-error', res.error || '上传失败')
                }
            } catch (ex) {
                setError('img-error', '响应解析失败')
            }
        }
        xhr.onerror = function () { setError('img-error', '上传网络错误') }
        xhr.send(formData)
    }
    reader.onerror = function () { setError('img-error', '读取文件失败') }
    reader.readAsArrayBuffer(file)
}

// ── 停止协作 ──────────────────────────
function leaveCollab() {
    DocSync.stop()
    WSManager.disconnect()
    setStatus('idle', '空闲')
    document.getElementById('online-section').style.display = 'none'
    document.getElementById('btn-join').style.display = ''
    document.getElementById('btn-join').disabled = false
    document.getElementById('user-list').innerHTML = ''
}

// ── 初始化 ────────────────────────────
window.onload = function () {
    if (Auth.isLoggedIn()) {
        document.getElementById('collab-username').textContent =
            Auth.getRealname() || Auth.getUsername()
        _prefillDocId()
        showView('view-collab')
        _startInvitePolling()   // 登录状态下开启轮询容错率
        _refreshNotifBadge()    // 初始化通知徽标
        // 每 30s 刷新一次通知徽标（即使不在协作中）
        setInterval(_refreshNotifBadge, 30000)
    } else {
        showView('view-login')
    }
}

// ─────────────────────────────────────────────
//  邀请功能
// ─────────────────────────────────────────────

// -- 分享视图数据 ———————————————————————
var _allUserGroups = []   // [{unit, users:[{username,realname}]}]

function openShareView() {
    var docId = document.getElementById('doc-id-input').value.trim()
    document.getElementById('share-doc-id').textContent = docId
    document.getElementById('share-error').textContent  = ''
    document.getElementById('share-search').value       = ''
    showView('view-share')
    _loadUserList()
}

function _loadUserList() {
    var container = document.getElementById('share-user-groups')
    container.innerHTML = '<div style="color:#999;font-size:12px;padding:20px 0;text-align:center">加载中…</div>'

    fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/users', {
        headers: { 'Authorization': 'Bearer ' + Auth.getToken() }
    })
    .then(function (res) { return res.json() })
    .then(function (data) {
        _allUserGroups = data.groups || []
        _renderUserGroups(_allUserGroups)
    })
    .catch(function () {
        container.innerHTML = '<div style="color:#ea4335;font-size:12px;padding:10px 0">加载失败，请重试</div>'
    })
}

function _renderUserGroups(groups) {
    var container = document.getElementById('share-user-groups')
    if (!groups || !groups.length) {
        container.innerHTML = '<div style="color:#999;font-size:12px;padding:20px 0;text-align:center">暂无其他已注册用户</div>'
        return
    }
    container.innerHTML = groups.map(function (g) {
        var items = g.users.map(function (u) {
            return '<label class="user-check-item">'
                + '<input type="checkbox" class="share-check" value="' + u.username + '">'
                + '<span class="user-check-name">' + (u.realname || u.username) + '</span>'
                + '<span class="user-check-login">' + u.username + '</span>'
                + '</label>'
        }).join('')
        return '<div class="unit-section">'
            + '<div class="unit-label">' + g.unit + '</div>'
            + items
            + '</div>'
    }).join('')
}

function filterShareUsers() {
    var kw = document.getElementById('share-search').value.trim().toLowerCase()
    if (!kw) {
        _renderUserGroups(_allUserGroups)
        return
    }
    var filtered = _allUserGroups.map(function (g) {
        return {
            unit: g.unit,
            users: g.users.filter(function (u) {
                return (u.realname || '').toLowerCase().indexOf(kw) >= 0
                    || u.username.toLowerCase().indexOf(kw) >= 0
                    || g.unit.toLowerCase().indexOf(kw) >= 0
            })
        }
    }).filter(function (g) { return g.users.length > 0 })
    _renderUserGroups(filtered)
}

function sendInvite() {
    var checked = document.querySelectorAll('.share-check:checked')
    if (!checked.length) {
        setError('share-error', '请勾选至少一个协作者')
        return
    }
    var usernames = []
    checked.forEach(function (el) { usernames.push(el.value) })
    var docId = document.getElementById('doc-id-input').value.trim()
    setError('share-error', '')

    fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/invite', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + Auth.getToken()
        },
        body: JSON.stringify({ doc_id: docId, usernames: usernames })
    })
    .then(function (res) { return res.json() })
    .then(function (data) {
        if (data.invited !== undefined) {
            alert('已向 ' + data.invited + ' 人发送邀请\u002c等待对方同意后即可加入。')
            showView('view-collab')
        } else {
            setError('share-error', data.error || '发送失败')
        }
    })
    .catch(function () { setError('share-error', '网络错误，请重试') })
}

// -- 邀请队列 ———————————————————————
var _inviteQueue    = []    // 待处理邀请队列
var _invitePolling  = null  // setInterval ID
var _knownInviteIds = {}    // {id: true}

function _queueInvitation(inv) {
    if (_knownInviteIds[inv.invite_id]) return
    _knownInviteIds[inv.invite_id] = true
    _inviteQueue.push(inv)
    if (_inviteQueue.length === 1) _showNextInvite()
}

function _showNextInvite() {
    if (!_inviteQueue.length) return
    var inv = _inviteQueue[0]
    var name = inv.from_realname || inv.from_user
    document.getElementById('invite-modal-text').innerHTML =
        '<strong>' + name + '</strong> 邀请您共同编辑文档：<br>'
        + '<strong style="color:#1a73e8">' + inv.doc_id + '</strong>'
    document.getElementById('invite-modal').classList.add('active')
}

function respondCurrentInvite(action) {
    if (!_inviteQueue.length) return
    var inv = _inviteQueue.shift()
    document.getElementById('invite-modal').classList.remove('active')

    fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/invite/' + inv.invite_id + '/respond', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + Auth.getToken()
        },
        body: JSON.stringify({ action: action })
    })
    .then(function (res) { return res.json() })
    .then(function (data) {
        if (action === 'accept' && data.ok) {
            _joinByDocId(data.doc_id, data.doc_path || '')
        }
        // 处理下一个邀请（如果有）
        setTimeout(_showNextInvite, 300)
    })
    .catch(function () { setTimeout(_showNextInvite, 300) })
}

function _joinByDocId(docId, docPath) {
    // 先退出当前协作房间（若有）
    if (DocSync.isRunning()) leaveCollab()
    showView('view-collab')

    function _doJoin() {
        document.getElementById('doc-id-input').value = docId
        joinCollab()
    }

    // 若服务器返回了文档完整路径，先打开/激活该文档再加入协作
    if (docPath) {
        try {
            var app  = window.Application
            var docs = app && app.Documents
            var targetDoc = null

            // 检查文档是否已经打开
            if (docs) {
                for (var i = 1; i <= docs.Count; i++) {
                    try {
                        if (docs.Item(i).FullName === docPath) {
                            targetDoc = docs.Item(i)
                            break
                        }
                    } catch (e) {}
                }
            }

            if (!targetDoc && docs) {
                // 文档未打开，新标签页打开
                targetDoc = docs.Open(docPath)
            }

            // 激活对应窗口，使 ActiveDocument 切换过来
            if (targetDoc) {
                try { targetDoc.Activate() } catch (e) {}
            }

            // 等待文档激活后再加入协作
            setTimeout(_doJoin, 800)
            return
        } catch (e) {
            console.warn('[Invite] 打开文档失败，直接加入协作', e)
        }
    }
    setTimeout(_doJoin, 200)
}

// -- 轮询未处理邀请（用户尚未加入任何房间时的容错率）———
function _startInvitePolling() {
    if (_invitePolling) return
    _invitePolling = setInterval(function () {
        if (!Auth.isLoggedIn()) return
        if (DocSync.isRunning()) return  // WS 已在线，由 WS 推送，无需轮询
        fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/invite/pending', {
            headers: { 'Authorization': 'Bearer ' + Auth.getToken() }
        })
        .then(function (res) { return res.json() })
        .then(function (data) {
            (data.invitations || []).forEach(_queueInvitation)
        })
        .catch(function () {})
    }, 5000)
}

function _stopInvitePolling() {
    if (_invitePolling) { clearInterval(_invitePolling); _invitePolling = null }
}

// ─────────────────────────────────────────────
//  历史文档功能
// ─────────────────────────────────────────────
function openHistoryView() {
    showView('view-history')
    _showHistDocList()
}

function _showHistDocList() {
    document.getElementById('hist-snap-panel').style.display = 'none'
    var listEl = document.getElementById('hist-doc-list')
    listEl.style.display = 'block'
    listEl.innerHTML = '<div style="color:#999;font-size:12px;padding:20px 0;text-align:center">加载中…</div>'
    setError('hist-error', '')

    fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/doc/history/all', {
        headers: { 'Authorization': 'Bearer ' + Auth.getToken() }
    })
    .then(function (r) { return r.json() })
    .then(function (data) {
        if (!data.length) {
            listEl.innerHTML = '<div style="color:#999;font-size:12px;padding:20px 0;text-align:center">暂无历史协作记录</div>'
            return
        }
        listEl.innerHTML = data.map(function (d) {
            var ts = d.last_saved ? d.last_saved.replace('T', ' ').slice(0, 16) : ''
            return '<div class="list-card" onclick="_showHistSnaps(\'' + d.doc_id.replace(/'/g,"\\'") + '\')">'  
                + '<div class="card-title">&#128196; ' + _esc(d.doc_id) + '</div>'
                + '<div class="card-meta">最后保存：' + ts + '</div>'
                + '</div>'
        }).join('')
    })
    .catch(function () { setError('hist-error', '加载失败，请重试') })
}

function _showHistSnaps(docId) {
    document.getElementById('hist-doc-list').style.display = 'none'
    var panel = document.getElementById('hist-snap-panel')
    var snapList = document.getElementById('hist-snap-list')
    document.getElementById('hist-panel-title').textContent = docId
    panel.style.display = 'block'
    snapList.innerHTML = '<div style="color:#999;font-size:12px;padding:10px 0;text-align:center">加载中…</div>'

    fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/doc/history/' + encodeURIComponent(docId), {
        headers: { 'Authorization': 'Bearer ' + Auth.getToken() }
    })
    .then(function (r) { return r.json() })
    .then(function (data) {
        if (!data.length) {
            snapList.innerHTML = '<div style="color:#999;font-size:12px;padding:10px 0;text-align:center">暂无保存记录</div>'
            return
        }
        snapList.innerHTML = data.map(function (s) {
            var ts = (s.saved_at || '').replace('T', ' ').slice(0, 16)
            return '<div class="hist-snap-item">'
                + '<span>' + _esc(s.saver) + ' &nbsp; <span style="color:#bbb">' + ts + '</span></span>'
                + '<button class="restore-btn" onclick="_restoreHistEntry(' + s.id + ')">恢复</button>'
                + '</div>'
        }).join('')
    })
    .catch(function () { setError('hist-error', '加载失败，请重试') })
}

function _restoreHistEntry(histId) {
    if (!confirm('确定要将当前文档恢复到该历史版本吗？当前内容将被替换。')) return
    fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/doc/history/entry/' + histId, {
        headers: { 'Authorization': 'Bearer ' + Auth.getToken() }
    })
    .then(function (r) { return r.json() })
    .then(function (data) {
        if (!data.content) { setError('hist-error', '该记录无内容'); return }
        DocSync.initFromSnapshot(data.content, null, [])
        alert('已恢复历史版本（' + (data.saved_at || '').slice(0, 16) + '）')
        showView('view-collab')
    })
    .catch(function () { setError('hist-error', '恢复失败，请重试') })
}

// ─────────────────────────────────────────────
//  通知功能
// ─────────────────────────────────────────────
function openNotifView() {
    showView('view-notifications')
    loadNotifications()
}

function loadNotifications() {
    var listEl = document.getElementById('notif-list')
    listEl.innerHTML = '<div style="color:#999;font-size:12px;padding:20px 0;text-align:center">加载中…</div>'
    setError('notif-error', '')

    fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/notifications', {
        headers: { 'Authorization': 'Bearer ' + Auth.getToken() }
    })
    .then(function (r) { return r.json() })
    .then(function (data) {
        if (!data.length) {
            listEl.innerHTML = '<div style="color:#999;font-size:12px;padding:20px 0;text-align:center">暂无通知</div>'
            return
        }
        listEl.innerHTML = data.map(function (n) {
            var ts  = (n.created_at || '').replace('T', ' ').slice(0, 16)
            var cls = 'list-card notif-card' + (n.is_read ? '' : ' unread')
            return '<div class="' + cls + '">'
                + '<div class="notif-content">' + _esc(n.content) + '</div>'
                + '<div class="notif-time">' + ts + '</div>'
                + '</div>'
        }).join('')
        // 更新徽标
        _updateNotifBadge(data.filter(function (n) { return !n.is_read }).length)
    })
    .catch(function () { setError('notif-error', '加载失败，请重试') })
}

function markAllRead() {
    fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/notifications/read', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + Auth.getToken() }
    })
    .then(function (r) { return r.json() })
    .then(function () {
        _updateNotifBadge(0)
        loadNotifications()
    })
    .catch(function () {})
}

function _updateNotifBadge(count) {
    var badge = document.getElementById('notif-badge')
    if (!badge) return
    if (count > 0) {
        badge.textContent = count > 99 ? '99+' : count
        badge.style.display = 'block'
    } else {
        badge.style.display = 'none'
    }
}

function _refreshNotifBadge() {
    if (!Auth.isLoggedIn()) return
    fetch(COLLAB_CONFIG.SERVER_HTTP + '/api/notifications', {
        headers: { 'Authorization': 'Bearer ' + Auth.getToken() }
    })
    .then(function (r) { return r.json() })
    .then(function (data) {
        var unread = data.filter(function (n) { return !n.is_read }).length
        _updateNotifBadge(unread)
    })
    .catch(function () {})
}

// 转义 HTML 特殊字符（防止 XSS）
function _esc(s) {
    if (!s) return ''
    return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
}
